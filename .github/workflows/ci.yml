name: Go Backend CI Pipeline

# 🚀 Tell the runner when to start
on:
  push:
    branches: ["main"] # Runs when code is pushed to the main branch
  pull_request:
    branches: ["main"] # Runs when a pull request targets the main branch

jobs:
  test-and-build:
    # 💻 Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # 1: Checkout our code from GitHub to the runner
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2: Install Go on the runner
      - name: 🐹 Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # Set the Go version to match your project (see go.mod)
          cache: true # Enable caching to speed up dependency downloads

      # 3: Download all modules from go.mod (same as running 'go mod download' locally)
      - name: 📦 Install dependencies
        run: go mod download

      # 4: Run all unit tests in the project
      - name: 🧪 Run Unit Tests
        run: go test -v ./...

      # 5: Build the application to ensure it compiles
      - name: 🔨 Build application
        run: go build -v -o main .
