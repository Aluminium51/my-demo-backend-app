name: Go Backend CI Pipeline

# 🚀 บอกหุ่นยนต์ว่า "ให้เริ่มทำงานเมื่อไหร่"
on:
  push:
    branches: ["main"] # ทำงานเมื่อมีการ push โค้ดเข้ากิ่ง main
  pull_request:
    branches: ["main"] # ทำงานเมื่อมีการเปิด Pull Request เข้ากิ่ง main

jobs:
  test-and-build:
    # 💻 สั่งให้หุ่นยนต์ไปเช่า Ubuntu เวอร์ชันล่าสุดมาทำงาน
    runs-on: ubuntu-latest

    steps:
      # 1: ดึงโค้ดของเราจาก GitHub ลงไปในเครื่องของหุ่นยนต์
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2: ติดตั้ง Go ลงในเครื่องหุ่นยนต์
      - name: 🐹 Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # ใส่เวอร์ชันภาษา Go ให้ตรงกับที่คุณใช้ (ดูได้จากไฟล์ go.mod)
          cache: true # เปิดระบบช่วยจำ (Cache) เพื่อให้รอบหน้าโหลด Library ไวขึ้น

      # 3: สั่งโหลด Library ทั้งหมดที่อยู่ใน go.mod (เหมือนเราพิมพ์ในเครื่องตัวเอง)
      - name: 📦 Install dependencies
        run: go mod download

      # 4: สั่งรัน Unit Test ทั้งหมดในโปรเจกต์ (จะไปสั่งรันไฟล์ user_service_test.go ที่เราเขียนไว้)
      - name: 🧪 Run Unit Tests
        run: go test -v ./...

      # 5: ลองสั่งคอมไพล์บิลด์แอปดู เพื่อเมคชัวร์ว่าไม่มีโค้ดบรรทัดไหนพิมพ์ผิดจนคอมไพล์ไม่ผ่าน
      - name: 🔨 Build application
        run: go build -v -o main .
